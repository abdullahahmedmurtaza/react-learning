<!DOCTYPE html>
<html>
  <head>
    <title>Practice 4</title>
    <style>
        .button-toggle-on{
            background-color: rgb(25, 135, 84);
            padding: 15px;
            border-radius: 10px;
            color: white;
        }
        .button-toggle-off{
            background-color: rgb(220, 53, 69);
            padding: 15px;
            border-radius: 10px;
            color: white;
        }

    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function Button(){
            const [isButtonOn, setIsButtonOn] = React.useState(true);
            function handleClick(){
               isButtonOn? setIsButtonOn(false) : setIsButtonOn(true);
            }
            return (
                <>
                    <button type="button" className={isButtonOn? 'button-toggle-on' : 'button-toggle-off'} onClick={handleClick}>{isButtonOn? 'ON' : 'OFF'}</button>
                </>
            );
        }
        function App(){
            return (
                <>
                    <Button />
                </>
            );
            
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
