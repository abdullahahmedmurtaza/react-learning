<!DOCTYPE html>
<html>
  <head>
    <title>Ecommerce</title>
  </head>
  <body>
    <div class="js-container"></div>


    <script src="./react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      function ProductDetails({
        productName,
        price,
        discountPrice,
        imageSrc
      }){
        return (
          <>
            <p>{productName}</p>
            <img src={imageSrc} alt="product-image" width="100"/>
            <br />
            {discountPrice? <del>Price: ${price}</del> : <p>Price: ${price}</p>}
            {discountPrice && (
              <p>Discount price: ${discountPrice}</p>
            )}
            <button>Add to Cart</button>
          </>
        );
      }

      function App(){
        return (
          <>
            <ProductDetails productName="Cotton socks" price="10.90" discountPrice="5.45" imageSrc="./cotton-socks.png"/>
            <ProductDetails productName="Tennis balls" price="6.00" imageSrc="./tennis-balls.png"/>
            <ProductDetails productName="Plain T-Shirt" price="7.99" imageSrc="./plain-t-shirt.png"/>
          </>
        );
      }
      const rootElement = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
