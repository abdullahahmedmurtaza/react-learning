<!DOCTYPE html>
<html>
  <head>
    <title>Counter</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="./react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function Counter({count, setCount}){
        
        function handleClick(){
          console.log('clicked');
          setCount(count+1);
        }
        return (
          <button onClick={handleClick}>{count === 1? `Clicked ${count} time` : `Clicked ${count} times`}</button>
        );
      }


      function Reset({setCount}){
        function handleClick(){
          console.log('reset');
          setCount(0);
        }
        return (
          <button onClick={handleClick}>Reset</button>
        );
      }

      function App(){
        const [count, setCount]= React.useState(0);
        return (
          <>
            <Counter count={count} setCount={setCount}/>
            <Counter count={count} setCount={setCount}/>
            <Reset setCount={setCount}/>
          </>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);


    </script>
  </body>
</html>
