<!-- Add some starter code -->

<!doctype html>
<html>
  <head>
    <title>Simple Chatbot</title>
    <style>
      .send-button {
        background-color : rgb(25, 135, 84);
        color: white;
        padding : 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input {
        padding : 12px 15px;
        border-radius : 10px;
        border-width : 1px;
        font-size : 15px;
        flex-grow : 1;
      }

      .input-container {
        display: flex;
        margin-bottom: 60px;
      }

      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-chatbot {
        display: flex;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 28px;
        max-width: 300px;
      }
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messges-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="./react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script type="text/babel">
      // Component is a piece of the website.
      // It is just a function that returns HTML.

      function ChatInput({ chatMessages, setChatMessages }) {
        const [textboxValue, setTextboxValue] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);
        function saveInputText(event) {
          // when onChange runs a function, it gives the function a value called event, that's why we have access to it in the params.
          // console.log(event.target.value);
          setTextboxValue(event.target.value);
        }
        function handleKeys(event) {
          event.key === "Enter" && sendMessage();
          event.key === "Escape" && setTextboxValue("");
        }
        const userMessage = {
          message: textboxValue,
          sender: "user",
          id: crypto.randomUUID(),
        };
        const loadingMessage = {
          message: "Loading......",
          sender: "chatbot",
          id: crypto.randomUUID(),
        };
        async function sendMessage() {
          if(isLoading || textboxValue === ''){
            return;
          }
          setTextboxValue("");
          setIsLoading(true);
          const newChatMessages = [
            ...chatMessages,
            userMessage,
          ];
          setChatMessages([...newChatMessages]);
          setChatMessages([...newChatMessages,loadingMessage]);
          const response = await Chatbot.getResponseAsync(textboxValue);
          const responseMessage = {
            message: response,
            sender: "chatbot",
            id: crypto.randomUUID(),
          };
          setChatMessages([...newChatMessages, responseMessage]);
          // console.log(response);
          setIsLoading(false);
        }

        // onChange is an event that runs a function when we change something in the input textbox
        return (
          <div className="input-container">
            <input
              placeholder="Send message to chatbot"
              size="30"
              onChange={saveInputText}
              value={textboxValue}
              onKeyDown={handleKeys}
              className = "chat-input"
            />
            <button className="send-button" onClick={sendMessage}>Send</button>
          </div>
        );
        
      }

      function ChatMessage({ message, sender }) {
        // In most react apps, props are directly destructured in the parentheses.

        // console.log(props);

        // const message = props.message;
        // const sender = props.sender;

        // Notice how we are duplicating some code when we can simply add an if statement in the html using brackets

        // Adding a simple if is not allowed so we use the guard operator that works like an if block.

        return (
          <div className={sender === 'user' ? 'chat-message-user' : 'chat-message-chatbot'}>
            {sender === "chatbot" && <img src="./robot.png" className="chat-message-profile" />}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && <img src="./user.png" className="chat-message-profile"  />}
          </div>
        );
      }

      // Instead of repeating the ChatMessage component, we can simply just save it in an array, and create a component for it

      function ChatMessages({ chatMessages }) {

// Hooks in react are a way to use react features in our component, they should never be used inside anything and only used at the top of the component

// useEffect is a hook that can be used to run some code when a component is created or updated.

// Use effect takes two arguments, a callback and an array (called the dependency array), which when left empty, only updates the component at the time of its creation. It controls when useEffect runs.

// Inside the dependency array, we can put some data like 'chatMessages'

// useRef is another hook that lets us create a div with special features this is known as a ref.
// First we need to grab the element (the div) which we need to scroll.



const chatMessagesRef = React.useRef(null);

React.useEffect(()=>{
  // console.log('updated');

  // print and check what is currently stored in the ref.
  console.log(chatMessagesRef.current);
  const containerElem = chatMessagesRef.current;
  // const containerElem = chatMessagesRef.current;
  if(containerElem){
// scrollTop means 'how far the element has already scrolled vertically'
// scrollHeight means 'total height of all the contents inside the scrollable elements'
    containerElem.scrollTop = containerElem.scrollHeight;
  }
},[chatMessages]);



        // Testing
        // console.log(chatMessages);

        // chatMessage is just a variable and we have to convert it into state.
        // useState gives us two values
        // 1. the current data.
        // 2. the method for updating the data (Updater function)

        //use array destructuring to get to the results of these things.

        // The state chatMessages has been lifted in App --> see App component.

        return (
          // props can take any type of value, remember to not run the function and only pass it's reference there, beause otherwise the function will return undefined and it will be saved in the the onClick.
          <div className="chat-messges-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
        // When returning an array of components give each one a unique key prop, this helps React track changes in the code.
      }

      // const button = <button>hello</button>;

      // If we don't want to use the divs we can also use fragments to group these elements together.

      // We can either call the function or
      // We can also use the "Our own HTML element syntax" which is much more preferred.

      // We can also add attributes to our own created HTML elements, by giving them a name and a value.

      // Then, we can also access these attributes and use them in our components. This is called props.

      // Every component by default has a parameter called props which is an object that contains ALL THE ATTRIBUTES WE PASS.

      // props --> short for properties because the attributes are saved as properties in this object.

      // Props are very useful as they make our code very reusable.

      // Instead of saving the app in a variable, the best practice is to use an app component.

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "Hello Chatbot",
            sender: "user",
            id: "1",
          },
          {
            message: "Hello! how can I help you?",
            sender: "chatbot",
            id: "2",
          },
          {
            message: "Can you get me today's date?",
            sender: "user",
            id: "3",
          },
          {
            message: "Today is september 27",
            sender: "chatbot",
            id: "4",
          },
        ]);

        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      // We have to make the website interactive by using adding the feature of displaying a message after sending it to the chatbot. We do this by using an event handler

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
